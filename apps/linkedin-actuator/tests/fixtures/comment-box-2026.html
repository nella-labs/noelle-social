<!--
  A migrated (SDUI) post-permalink comment composer, faithful to the live
  2026-07 DOM (captured from a real session). Obfuscated hash classes
  everywhere. Two buttons read "Comment":
    1. the ACTION-BAR TOGGLE (opens the composer) — carries the comment-bubble
       sprite `svg#comment-small` and a count span; aria-label "Comment".
    2. the COMPOSER SUBMIT (posts the comment) — rendered AFTER the TipTap
       editor, next to Emoji/GIF/Photo, INSIDE a `componentkey*=commentButtonSection`
       wrapper, type=button, its label the word "Comment" as text, NO sprite.
  The real submit lives in `commentButtonSection`; treating that wrapper as a
  toggle signal (as the locator once did) discarded it and caused the wf=0 wall.
  A thread "Reply" inside a replaceableComment item is a further decoy.
-->
