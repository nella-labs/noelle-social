<!-- Captured from a September 2026 permalink before the post Comment action
     opens its TipTap composer. The action has no aria-label; the icon ID and
     visible text distinguish it from the count and nested Reply buttons. -->
<main>
  <div role="listitem" componentkey="update-card-focusabcFeedType_FEED_DETAIL">
    <p data-testid="expandable-text-box">A post about developer tools.</p>
    <button type="button" aria-label="1 comment">1 comment</button>
    <div style="min-height: 4.4rem">
      <button type="button" aria-label="Reaction button state: no reaction">Like</button>
      <button type="button" componentkey="post-comment-action">
        <span><svg id="comment-small" viewBox="0 0 16 16"></svg><span>Comment</span></span>
      </button>
      <button type="button">Repost</button>
    </div>
    <div componentkey="replaceableComment_1"><button type="button" aria-label="Reply"><svg id="comment-small"></svg>Reply</button></div>
  </div>
  <aside class="msg-overlay-list-bubble"><form class="msg-form"><div role="textbox" contenteditable="true" aria-label="Write a message"></div></form></aside>
</main>
