<!--
  LinkedIn's unavailable/deleted-post permalink: navigating to a comment target
  whose post was removed renders this instead of a composer. The actuator must
  detect it and DROP the draft rather than retry the dead permalink every slot.
-->
<div class="application-outlet">
  <nav>Home My Network Jobs Messaging Notifications</nav>
  <main>
    <section class="artdeco-empty-state">
      <img alt="" />
      <h2>This post cannot be displayed</h2>
    </section>
  </main>
</div>
