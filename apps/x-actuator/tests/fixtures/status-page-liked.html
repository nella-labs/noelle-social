<!-- Same status page, but the focal tweet is ALREADY liked: the like button's
     testid swaps to "unlike". -->
<div aria-label="Timeline: Conversation">
  <article data-testid="tweet">
    <div data-testid="User-Name"><span>Bob Builder</span> <span>@bob</span></div>
    <div data-testid="tweetText" lang="en">the tweet we just replied to, already liked</div>
    <time datetime="2026-07-01T10:00:00.000Z">10:00 AM · Jul 1, 2026</time>
    <div role="group">
      <button data-testid="reply" aria-label="Reply"></button>
      <button data-testid="unlike" aria-label="Liked"></button>
    </div>
  </article>
</div>
