  <path d="M1355 1040 C1325 775 1550 674 1803 609 C2100 532 2320 360 2510 -160" fill="none" stroke="url(#thread)" stroke-width="33" filter="url(#edge-light)" opacity=".5" />
  <path d="M1190 -180 C1223 166 1513 240 1752 294 C2020 354 2266 540 2350 1000" fill="none" stroke="url(#ribbon)" stroke-width="98" filter="url(#soft-light)" opacity=".45" />
  <path d="M1300 -140 C1330 150 1530 250 1784 304 C2055 362 2246 540 2320 996" fill="none" stroke="url(#thread)" stroke-width="19" filter="url(#edge-light)" opacity=".3" />
  <rect width="2400" height="900" filter="url(#grain)" opacity=".62" />
