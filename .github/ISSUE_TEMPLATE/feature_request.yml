name: Feature request
description: Propose an improvement to a social growth workflow.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow and who this helps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the result and its scope.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Use fictional or public examples without private account data.
